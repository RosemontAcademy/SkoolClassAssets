<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Broken Roof</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:Georgia,'Times New Roman',serif;background:linear-gradient(160deg,#5a3a1c,#2a1a0d);
    color:#fff2df;display:flex;flex-direction:column;overflow:hidden;user-select:none}
  header{padding:14px 18px;font:700 15px/1 Arial;letter-spacing:.04em;opacity:.85;text-align:center}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  .page{max-width:680px;text-align:center}
  .page .num{font:700 13px Arial;letter-spacing:.2em;color:#ffab4d;margin-bottom:22px}
  .page .txt{font-size:clamp(24px,5.2vw,40px);line-height:1.5;font-weight:600}
  .dots{display:flex;gap:8px;justify-content:center;padding:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}
  .dot.on{background:#ffab4d}
  nav{display:flex;gap:12px;justify-content:center;padding:16px 20px 26px}
  button{font:800 16px Arial;border:0;border-radius:16px;padding:14px 26px;cursor:pointer;
    background:#ffab4d;color:#1a1a2e;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .1s}
  button:active{transform:scale(.95)}
  button.ghost{background:rgba(255,255,255,.12);color:#fff2df}
  button:disabled{opacity:.35;cursor:default}
  .done{font:800 18px Arial;color:#ffab4d;text-align:center;padding:6px}
</style></head><body>
<header id="hd"></header>
<main><div class="page"><div class="num" id="num"></div><div class="txt" id="txt"></div></div></main>
<div class="done" id="done" style="visibility:hidden">✅ You finished the book!</div>
<div class="dots" id="dots"></div>
<nav><button class="ghost" id="prev">◀ Back</button><button id="next">Next ▶</button></nav>
<script>
  var BOOK = {"title":"The Broken Roof","pages":["It rained all night. Water dripped through the old broken roof.","Dad put a bucket under the hole. Drip, drip, drip it went!","In the morning, Dad went up a tall ladder to fix the roof.","He put new tiles on the top. He worked hard in the warm sun.","Now the roof was strong again. No more water came inside.","That night it rained again, but the family stayed warm and dry."]};
  var PAGES = BOOK.pages, idx = 0, reached = 0;
  function emit(m){ try{ parent.postMessage(Object.assign({source:'syncbook'}, m), '*'); }catch(e){} }
  function sendContext(){ emit({type:'bookContext', aiHelper:true, total:PAGES.length,
    pages:PAGES.map(function(t,i){return {page:i+1, text:t};})}); }
  document.getElementById('hd').textContent = BOOK.title;
  var dotsEl = document.getElementById('dots');
  PAGES.forEach(function(){ var d=document.createElement('div'); d.className='dot'; dotsEl.appendChild(d); });
  function render(){
    document.getElementById('num').textContent = 'PAGE ' + (idx+1) + ' / ' + PAGES.length;
    document.getElementById('txt').textContent = PAGES[idx];
    [].forEach.call(dotsEl.children, function(d,i){ d.className = 'dot' + (i===idx?' on':''); });
    document.getElementById('prev').disabled = idx===0;
    document.getElementById('next').disabled = idx===PAGES.length-1;
    document.getElementById('done').style.visibility = (reached>=PAGES.length-1)?'visible':'hidden';
    emit({type:'progress', page:idx+1, total:PAGES.length});
    if(idx===PAGES.length-1) emit({type:'complete', page:idx+1, total:PAGES.length});
  }
  function go(i){ idx=Math.max(0,Math.min(PAGES.length-1,i)); reached=Math.max(reached,idx); render(); }
  document.getElementById('prev').onclick=function(){ go(idx-1); };
  document.getElementById('next').onclick=function(){ go(idx+1); };
  window.addEventListener('message', function(e){ var d=e.data||{};
    if(d.type==='sb:getContext') sendContext();
    else if(d.type==='sb:goToPage') go((d.page||1)-1);
  });
  sendContext(); render();
</script></body></html>
